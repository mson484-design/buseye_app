<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BusEye Commercial AI Edge Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; background-color: #1e293b; padding: 8px 12px; border-radius: 8px; }
    .title { font-size: 14px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .mode-badge { background: #0284c7; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .rec-badge { background-color: #ef4444; color: white; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    
    /* 4채널 자동 가변 그리드 */
    .screen-container { position: relative; background-color: #000; border: 2px solid #22d3ee; border-radius: 10px; height: 50vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; overflow: hidden; transition: all 0.3s ease; }
    
    .ch-box { position: relative; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; border: 1px solid #334155; transition: all 0.3s ease; }
    .ch-label { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.8); color: #38bdf8; font-size: 9px; font-weight: bold; padding: 2px 4px; border-radius: 3px; }
    .ch-ai-tag { position: absolute; top: 4px; right: 4px; background: rgba(16, 185, 129, 0.25); color: #34d399; font-size: 8px; font-weight: bold; padding: 2px 4px; border-radius: 3px; }
    
    .cam-icon { font-size: 26px; color: #22d3ee; }
    .cam-status { font-size: 10px; font-weight: bold; color: #94a3b8; margin-top: 2px; }
    
    /* 위험 감지 시 자동 전체화면 팝업 클래스 */
    .ch-focus { grid-column: 1 / span 2 !important; grid-row: 1 / span 2 !important; z-index: 10 !important; border: 3px solid #ef4444 !important; background: #1c1917 !important; }
    .ch-focus .cam-icon { font-size: 48px; }
    .ch-focus .cam-status { font-size: 14px; color: #f87171; font-weight: bold; }

    .speed-box { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.85); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3); z-index: 20; }
    .speed-val { font-size: 32px; font-weight: 800; color: #22d3ee; }
    .speed-unit { font-size: 11px; color: #94a3b8; font-weight: bold; margin-left: 2px; }

    .status-panel { background: rgba(34, 211, 238, 0.15); border: 1px solid #22d3ee; color: #22d3ee; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; min-height: 42px; display: flex; align-items: center; justify-content: center; }
    
    .ai-engine-bar { background: #1e293b; padding: 8px; border-radius: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
    .engine-active { color: #34d399; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    .engine-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; animation: blink 1.2s infinite; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">
      BusEye 82A Edge Brain
      <span class="mode-badge" id="vehicleMode">버스 다채널 AI</span>
    </div>
    <div class="rec-badge" id="recBadge">AI ACTIVE</div>
  </div>

  <div class="screen-container" id="screenBox">
    <!-- CH1 전방 -->
    <div class="ch-box" id="ch1">
      <div class="ch-label">CH1 전방 주행</div>
      <div class="ch-ai-tag">추돌/차선 AI</div>
      <div class="cam-icon">🟢</div>
      <div class="cam-status">정상 주행 관제</div>
    </div>

    <!-- CH2 실내 승객 -->
    <div class="ch-box" id="ch2">
      <div class="ch-label">CH2 실내 승객</div>
      <div class="ch-ai-tag">승객 전도 AI</div>
      <div class="cam-icon">🟢</div>
      <div class="cam-status" id="ch2Status">승객 자세 감지 중</div>
    </div>

    <!-- CH3 우측 사각 -->
    <div class="ch-box" id="ch3">
      <div class="ch-label">CH3 우측 사각</div>
      <div class="ch-ai-tag">이륜차/보행 AI</div>
      <div class="cam-icon">🟢</div>
      <div class="cam-status" id="ch3Status">사각지대 감시 중</div>
    </div>

    <!-- CH4 하차문 -->
    <div class="ch-box" id="ch4">
      <div class="ch-label">CH4 하차문</div>
      <div class="ch-ai-tag">끼임 방지 AI</div>
      <div class="cam-icon">🟢</div>
      <div class="cam-status">하차 안전 관제</div>
    </div>

    <div class="speed-box">
      <span class="speed-val" id="speedVal">0</span>
      <span class="speed-unit">km/h</span>
    </div>
  </div>

  <div class="status-panel" id="statusMsg">
    온디바이스 AI 비전 엔진 가동 중 · 완전 자동 관제
  </div>

  <div class="ai-engine-bar">
    <div class="engine-active"><span class="engine-dot"></span> RTSP Multi-Stream Sync OK</div>
    <div style="color: #94a3b8;">NPU Load: 14% · Latency: 18ms</div>
  </div>

  <script>
    let speed = 0;
    let targetSpeed = 0;
    let autoAlertTimer = null;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    // 초정밀 GPS 연동
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          let s = (pos.coords.speed && pos.coords.speed > 0) ? pos.coords.speed * 3.6 : 0;
          targetSpeed = s;
          checkAutomaticSafetyRules(s);
        },
        (err) => console.log("GPS 수신 중"),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 4000 }
      );
    }

    // 1km/h 단위 속도 계측
    setInterval(() => {
      if (Math.abs(speed - targetSpeed) > 0.2) {
        speed += (targetSpeed - speed) * 0.35;
      } else {
        speed = targetSpeed;
      }
      document.getElementById('speedVal').innerText = Math.round(speed);
    }, 100);

    // [상용 AI 핵심] GPS 및 주행 패턴에 따른 자동 위험 판별 알고리즘
    let hasAlertedLaunch = false;
    function checkAutomaticSafetyRules(currentSpeed) {
      // 정차 후 출발 시 (0 -> 5km/h 이상 급가속 시 승객 미착석 자동 감지 시나리오)
      if (currentSpeed > 4 && currentSpeed < 25 && !hasAlertedLaunch) {
        hasAlertedLaunch = true;
        autoTriggerFocus('ch2', '승객 미착석 출발 주의!', '#ef4444', '승객이 아직 착석하지 않았습니다. 서행하십시오.');
        setTimeout(() => { resetAutoFocus(); }, 4500);
      }
      if (currentSpeed === 0) {
        hasAlertedLaunch = false; // 정차 시 플래그 리셋
      }
    }

    // AI 자동 팝업 및 원상복귀 함수
    function autoTriggerFocus(chId, msg, color, voiceText) {
      resetAutoFocus();
      const target = document.getElementById(chId);
      const panel = document.getElementById('statusMsg');
      const box = document.getElementById('screenBox');

      target.classList.add('ch-focus');
      panel.innerText = msg;
      panel.style.color = color;
      panel.style.borderColor = color;
      box.style.borderColor = color;

      speak(voiceText);
    }

    function resetAutoFocus() {
      document.querySelectorAll('.ch-box').forEach(el => el.classList.remove('ch-focus'));
      const panel = document.getElementById('statusMsg');
      const box = document.getElementById('screenBox');
      panel.innerText = "온디바이스 AI 비전 엔진 가동 중 · 정상 관제";
      panel.style.color = "#22d3ee";
      panel.style.borderColor = "#22d3ee";
      box.style.borderColor = "#22d3ee";
    }

    // 시작 시 자동 안내
    setTimeout(() => {
      speak("버스아이 상용 비전 인공지능 시스템이 자동 가동되었습니다.");
    }, 1000);
  </script>
</body>
</html>
