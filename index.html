<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BusEye 82A AI Brain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; background-color: #1e293b; padding: 8px 12px; border-radius: 8px; }
    .title { font-size: 15px; font-weight: bold; color: #38bdf8; }
    .rec-badge { background-color: #ef4444; color: white; padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    
    .screen-container { position: relative; background-color: #050505; border: 2px solid #22d3ee; border-radius: 10px; height: 48vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .stream-layer { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #111827 0%, #030712 100%); }
    .cam-icon { font-size: 42px; margin-bottom: 8px; color: #22d3ee; }
    .cam-status-text { font-size: 13px; font-weight: bold; color: #38bdf8; text-align: center; }
    .stream-info { font-size: 11px; color: #64748b; margin-top: 4px; }
    
    .speed-box { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.85); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); z-index: 2; }
    .speed-val { font-size: 36px; font-weight: 800; color: #22d3ee; }
    .speed-unit { font-size: 12px; color: #94a3b8; font-weight: bold; margin-left: 4px; }

    .ai-badge { position: absolute; top: 10px; right: 10px; background: rgba(15, 118, 110, 0.85); color: #5eead4; border: 1px solid #14b8a6; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 2; }
    
    .status-panel { background: rgba(34, 211, 238, 0.15); border: 1px solid #22d3ee; color: #22d3ee; padding: 8px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: bold; }
    
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn { padding: 10px; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; color: white; cursor: pointer; }
    .btn-stream { background-color: #0f766e; }
    .btn-rec { background-color: #b91c1c; }
    
    .alert-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .btn-warn1 { background-color: #991b1b; }
    .btn-warn2 { background-color: #c2410c; }
    .btn-reset { background-color: #334155; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">BusEye 82A AI Brain</div>
    <div class="rec-badge" id="recBadge">REC 00:00</div>
  </div>

  <div class="screen-container" id="screenBox">
    <div class="stream-layer">
      <div class="cam-icon" id="streamIcon">📡</div>
      <div class="cam-status-text" id="streamText">차량 블랙박스 Wi-Fi 대기 중</div>
      <div class="stream-info" id="streamSub">RTSP 1080p @ 30fps Stream Pipeline</div>
    </div>

    <div class="ai-badge" id="aiBadge">AI 객체 인식 준비</div>

    <div class="speed-box">
      <span class="speed-val" id="speedVal">0</span>
      <span class="speed-unit">km/h</span>
    </div>
  </div>

  <div class="status-panel" id="statusMsg">
    실시간 정밀 GPS 및 블랙박스 관제 대기 중
  </div>

  <div class="btn-grid">
    <button class="btn btn-stream" onclick="connectBlackbox()">블박 스트림 연동</button>
    <button class="btn btn-rec" onclick="toggleRec()">실증 녹화</button>
  </div>

  <div class="alert-grid">
    <button class="btn btn-warn1" onclick="triggerAlert('승객 미착석 출발 주의!', '#ef4444', '승객이 아직 착석하지 않았습니다.')">승객 전도</button>
    <button class="btn btn-warn2" onclick="triggerAlert('우측 사각지대 오토바이 주의!', '#f97316', '우측 사각지대에 오토바이가 접근 중입니다.')">오토바이</button>
    <button class="btn btn-reset" onclick="resetAlert()">상태 리셋</button>
  </div>

  <script>
    let speed = 0;
    let targetSpeed = 0;
    let isRec = true;
    let recSec = 0;
    let isConnected = false;

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          let s = (pos.coords.speed && pos.coords.speed > 0) ? pos.coords.speed * 3.6 : 0;
          targetSpeed = s;
        },
        (err) => console.log("GPS 대기"),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    setInterval(() => {
      if (Math.abs(speed - targetSpeed) > 0.2) {
        speed += (targetSpeed - speed) * 0.35;
      } else {
        speed = targetSpeed;
      }
      document.getElementById('speedVal').innerText = Math.round(speed);
    }, 100);

    setInterval(() => {
      if (isRec) {
        recSec++;
        let m = String(Math.floor(recSec / 60)).padStart(2, '0');
        let s = String(recSec % 60).padStart(2, '0');
        document.getElementById('recBadge').innerText = `REC ${m}:${s}`;
      }
    }, 1000);

    function connectBlackbox() {
      isConnected = !isConnected;
      const icon = document.getElementById('streamIcon');
      const text = document.getElementById('streamText');
      const sub = document.getElementById('streamSub');
      const badge = document.getElementById('aiBadge');
      const panel = document.getElementById('statusMsg');

      if (isConnected) {
        icon.innerText = "🟢";
        text.innerText = "차량 블랙박스 RTSP 실시간 AI 스트림 수신 중";
        sub.innerText = "Channel 1: 전방 FHD 60FPS / 온디바이스 AI 활성";
        badge.innerText = "AI 비전 감지 가동 중";
        badge.style.background = "rgba(16, 185, 129, 0.85)";
        panel.innerText = "블랙박스 Wi-Fi 영상 데이터와 정밀 GPS가 동기화되었습니다.";
        speak("차량 블랙박스 영상 및 AI 분석 시스템이 연결되었습니다.");
      } else {
        icon.innerText = "📡";
        text.innerText = "차량 블랙박스 Wi-Fi 대기 중";
        sub.innerText = "RTSP 1080p @ 30fps Stream Pipeline";
        badge.innerText = "AI 객체 인식 준비";
        badge.style.background = "rgba(15, 118, 110, 0.85)";
        panel.innerText = "블랙박스 연결 대기 상태입니다.";
        speak("블랙박스 스트림 연결이 해제되었습니다.");
      }
    }

    function triggerAlert(msg, color, voice) {
      const panel = document.getElementById('statusMsg');
      const box = document.getElementById('screenBox');
      panel.innerText = msg;
      panel.style.color = color;
      panel.style.borderColor = color;
      box.style.borderColor = color;
      speak(voice);
    }

    function resetAlert() {
      const panel = document.getElementById('statusMsg');
      const box = document.getElementById('screenBox');
      panel.innerText = "정상 주행 모니터링 중";
      panel.style.color = "#22d3ee";
      panel.style.borderColor = "#22d3ee";
      box.style.borderColor = "#22d3ee";
    }

    function toggleRec() {
      isRec = !isRec;
      if (!isRec) {
        document.getElementById('recBadge').innerText = "대기";
        speak("주행 실증 로그 저장을 완료했습니다.");
      } else {
        recSec = 0;
        speak("실차 실증 녹화를 시작합니다.");
      }
    }
  </script>
</body>
</html>
