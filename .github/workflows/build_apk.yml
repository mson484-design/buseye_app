name: Build BusEye APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Reconstruct Android v2 Embedding
      run: |
        # 1. 구형 v1 흔적이 있는 파일 정리
        rm -rf android/app/src/main/java 2>/dev/null || true
        mkdir -p android/app/src/main/kotlin/com/buseye/safety

        # 2. 최신 v2 FlutterActivity 표준 파일 생성
        cat << 'EOF' > android/app/src/main/kotlin/com/buseye/safety/MainActivity.kt
        package com.buseye.safety

        import io.flutter.embedding.android.FlutterActivity

        class MainActivity: FlutterActivity() {
        }
        EOF

        # 3. AndroidManifest 내 v1 태그 잔여물 완전 제거
        if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
          sed -i '/flutterEmbedding/d' android/app/src/main/AndroidManifest.xml || true
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: buseye-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
