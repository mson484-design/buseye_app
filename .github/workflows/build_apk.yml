name: Build BusEye APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Align Android Structure & Compatibility
      run: |
        # 1. 최신 안드로이드 소스 표준 경로 생성
        mkdir -p android/app/src/main/kotlin/com/buseye/safety
        mkdir -p android/app/src/main/res/values

        # 2. 루트에 잘못 나와 있는 코틀린 파일들을 표준 패키지 폴더로 이동/정리
        if [ -f "android/MainActivity.kt" ]; then
          mv android/*.kt android/app/src/main/kotlin/com/buseye/safety/ 2>/dev/null || true
        fi

        # 3. AndroidManifest v1 임베딩 태그 일괄 제거
        if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
          sed -i '/flutterEmbedding/d' android/app/src/main/AndroidManifest.xml || true
        fi
        if [ -f "android/AndroidManifest.xml" ]; then
          sed -i '/flutterEmbedding/d' android/AndroidManifest.xml || true
        fi

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: buseye-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
